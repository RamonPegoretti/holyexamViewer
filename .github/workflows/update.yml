name: Update grades page

on:
  schedule:
    # Check for new grades / finished exams every 30 minutes during the day (UTC).
    # The page is only republished when something changed.
    - cron: '*/30 5-20 * * *'
    # Daily refresh around 17:00 Swiss time (15:00 and 16:00 UTC cover summer and winter time).
    - cron: '0 15,16 * * *'
  workflow_dispatch:            # "Run workflow" button: always republishes

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22   # supabase-js 2.117 needs Node 22+
      - run: npm ci
      - name: Fetch grades
        run: node fetch.mjs
        env:
          HOLYEXAM_EMAIL: ${{ secrets.HOLYEXAM_EMAIL }}
          HOLYEXAM_PASSWORD: ${{ secrets.HOLYEXAM_PASSWORD }}
      - name: Decide whether to publish
        id: check
        run: |
          test -n "$STATICRYPT_PASSWORD" || { echo "PAGE_PASSWORD secret is missing"; exit 1; }
          # Keyed hash of the data, so the public version.txt reveals nothing about the grades.
          version=$(openssl dgst -sha256 -hmac "$STATICRYPT_PASSWORD" -r data.json | cut -d' ' -f1)
          echo "$version" > version.txt
          live=$(curl -fsS "https://ramonpegoretti.github.io/holyexamViewer/version.txt" || true)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then reason="manual run"
          elif [ "$CRON" = "0 15,16 * * *" ]; then reason="daily refresh"
          elif [ "$version" != "$live" ]; then reason="data changed"
          else reason=""; fi
          if [ -n "$reason" ]; then echo "Publishing: $reason"; echo "publish=true" >> "$GITHUB_OUTPUT"
          else echo "Nothing changed, not publishing."; echo "publish=false" >> "$GITHUB_OUTPUT"; fi
        env:
          STATICRYPT_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          CRON: ${{ github.event.schedule }}
      - name: Password-protect the page
        if: steps.check.outputs.publish == 'true'
        run: |
          npx staticrypt dist/index.html -d dist --short --remember 0 \
            -t login-template.html \
            --template-title "Voti di Ramon" \
            --template-instructions "Inserisci la password per vedere i voti." \
            --template-placeholder "Password" \
            --template-button "Entra" \
            --template-remember "Ricordami su questo dispositivo" \
            --template-error "Password sbagliata" \
            --template-toggle-show "Mostra password" \
            --template-toggle-hide "Nascondi password" \
            --template-color-primary "#7c5cff" \
            --template-color-secondary "#0b0f17"
          mv version.txt dist/version.txt
          cp public/* dist/   # home-screen icons and web-app manifest (no grades in them)
        env:
          STATICRYPT_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
      - if: steps.check.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
