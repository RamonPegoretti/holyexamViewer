name: Update grades page

on:
  schedule:
    # Check for new grades / finished exams every 30 minutes during the day (UTC).
    # The page is only republished when something changed.
    - cron: '*/30 5-20 * * *'
    # Daily refresh around 17:00 Swiss time (15:00 and 16:00 UTC cover summer and winter time).
    - cron: '0 15,16 * * *'
  # "Run workflow" button: always republishes.
  # GitHub skips most scheduled runs on this repo, so a timer in the shared-calendar Supabase
  # also starts this workflow (source 'timer' every 15 min, 'daily' at ~17:00 Swiss time).
  workflow_dispatch:
    inputs:
      source:
        description: 'Who started the run (leave on manual)'
        type: choice
        options: [manual, timer, daily]
        default: manual
      test_push:
        description: 'Send a test popup to every signed-up phone'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      notify: ${{ steps.plan.outputs.notify }}
      messages: ${{ steps.plan.outputs.messages }}
      state: ${{ steps.plan.outputs.state }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22   # supabase-js 2.117 needs Node 22+
      - run: npm ci
      - name: Fetch grades
        run: node fetch.mjs
        env:
          HOLYEXAM_EMAIL: ${{ secrets.HOLYEXAM_EMAIL }}
          HOLYEXAM_PASSWORD: ${{ secrets.HOLYEXAM_PASSWORD }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
      - name: Plan popup notifications
        id: plan
        continue-on-error: true   # a notification problem must never stop the page from updating
        run: node push.mjs plan
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          TEST_PUSH: ${{ inputs.test_push }}
      - name: Decide whether to publish
        id: check
        run: |
          test -n "$STATICRYPT_PASSWORD" || { echo "PAGE_PASSWORD secret is missing"; exit 1; }
          # Keyed hash of the data, so the public version.txt reveals nothing about the grades.
          version=$(openssl dgst -sha256 -hmac "$STATICRYPT_PASSWORD" -r data.json | cut -d' ' -f1)
          echo "$version" > version.txt
          live=$(curl -fsS "https://ramonpegoretti.github.io/holyexamViewer/version.txt" || true)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$SOURCE" = "manual" ]; then reason="manual run"
          elif [ "$CRON" = "0 15,16 * * *" ] || [ "$SOURCE" = "daily" ]; then reason="daily refresh"
          elif [ "$version" != "$live" ]; then reason="data changed"
          else reason=""; fi
          if [ -n "$reason" ]; then echo "Publishing: $reason"; echo "publish=true" >> "$GITHUB_OUTPUT"
          else echo "Nothing changed, not publishing."; echo "publish=false" >> "$GITHUB_OUTPUT"; fi
        env:
          STATICRYPT_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          CRON: ${{ github.event.schedule }}
          SOURCE: ${{ inputs.source || 'manual' }}
      - name: Hand the timer its token
        continue-on-error: true
        run: node push.mjs timer
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      - name: Password-protect the page
        if: steps.check.outputs.publish == 'true'
        run: |
          npx staticrypt dist/index.html -d dist --short --remember 0 \
            -t login-template.html \
            --template-title "Voti di Ramon" \
            --template-instructions "Inserisci la password per vedere i voti." \
            --template-placeholder "Password" \
            --template-button "Entra" \
            --template-remember "Ricordami su questo dispositivo" \
            --template-error "Password sbagliata" \
            --template-toggle-show "Mostra password" \
            --template-toggle-hide "Nascondi password" \
            --template-color-primary "#7c5cff" \
            --template-color-secondary "#0b0f17"
          mv version.txt dist/version.txt
          cp public/* dist/   # home-screen icons and web-app manifest (no grades in them)
        env:
          STATICRYPT_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
      - if: steps.check.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [build, deploy]
    # After the page is live (or when nothing needed publishing), send what the build planned.
    if: always() && needs.build.result == 'success' && needs.build.outputs.notify == 'true' && needs.deploy.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Send popup notifications
        run: node push.mjs send
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          MESSAGES: ${{ needs.build.outputs.messages }}
          STATE: ${{ needs.build.outputs.state }}
