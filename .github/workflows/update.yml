name: Update grades page

on:
  schedule:
    - cron: '17 5-20/3 * * *'   # every 3 hours during the day (UTC)
  workflow_dispatch:            # "Run workflow" button for manual updates

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22   # supabase-js 2.117 needs Node 22+
      - run: npm ci
      - name: Fetch grades
        run: node fetch.mjs
        env:
          HOLYEXAM_EMAIL: ${{ secrets.HOLYEXAM_EMAIL }}
          HOLYEXAM_PASSWORD: ${{ secrets.HOLYEXAM_PASSWORD }}
      - name: Password-protect the page
        run: |
          test -n "$STATICRYPT_PASSWORD" || { echo "PAGE_PASSWORD secret is missing"; exit 1; }
          npx staticrypt dist/index.html -d dist --short --remember 30 --template-title "Voti di Ramon"
        env:
          STATICRYPT_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
